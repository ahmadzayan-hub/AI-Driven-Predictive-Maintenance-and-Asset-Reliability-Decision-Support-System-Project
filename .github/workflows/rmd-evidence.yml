name: RMD evidence checks

on:
  push:
    paths:
      - 'server/**'
      - 'tests/test_rmd*'
      - 'tests/test_knowledge_access.py'
      - 'tests/test_platform_contract.py'
      - 'tests/test_publication_target.py'
      - 'frontend/**'
      - 'scripts/verify.py'
      - '.github/workflows/rmd-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Synthetic evidence and permission regressions
        run: python -m unittest tests.test_publication_target tests.test_platform_contract tests.test_rmd_ingestion tests.test_rmd_analytics tests.test_rmd_service tests.test_rmd_workflow tests.test_knowledge_access tests.test_operations.OperationsTest tests.test_p2_slice_one tests.test_agent_runtime -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Type check
        run: npm run typecheck
        working-directory: frontend
      - name: Component regressions
        run: npm test
        working-directory: frontend
      - name: Production bundle
        run: npm run build
        working-directory: frontend
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend
      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Evidence journey, Arabic phone and accessibility
        run: npx playwright test rmd.spec.ts platform.spec.ts --max-failures=1
        working-directory: frontend
      - name: Sidebar navigation contract
        run: npx playwright test overview.spec.ts --grep "sidebar groups" --project=desktop
        working-directory: frontend
      - name: Existing Miyaar bilingual, voice and accessibility
        run: npx playwright test --config=playwright.miyaar.config.ts
        working-directory: frontend
      - name: Interface budget
        run: python -c "from scripts.verify import check_budget; import sys; ok, detail = check_budget(); print(detail); sys.exit(0 if ok else 1)"
      - name: Retain synthetic UI verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rmd-synthetic-checks
          path: |
            frontend/dist
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
