name: Android build

on:
  push:
    paths:
      - 'apps/android/**'
      - 'scripts/build-apk.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select the runner's JDK and Android SDK
        run: |
          test -d "$JAVA_HOME_17_X64"
          test -d "$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Core tests, Compose unit tests, Android lint and debug APK
        run: |
          chmod +x apps/android/gradlew
          bash scripts/build-apk.sh
      - name: Retain installable debug APK and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-reliability-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports
            apps/android/core/build/reports/tests
          retention-days: 14
