name: Android build

on:
  push:
    paths:
      - 'apps/android/**'
      - 'scripts/build-apk.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select the runner's JDK and Android SDK
        run: |
          test -d "$JAVA_HOME_17_X64"
          test -d "$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-${{ hashFiles('apps/android/**/*.gradle.kts', 'apps/android/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Core tests, Compose unit tests, Android lint and debug APK
        run: |
          chmod +x apps/android/gradlew
          bash scripts/build-apk.sh
      - name: Verify APK signature and record measured build evidence
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose apps/android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import hashlib, json, xml.etree.ElementTree as ET, zipfile
          from pathlib import Path
          root = Path('apps/android')
          apk = root / 'app/build/outputs/apk/debug/app-debug.apk'
          suites = []
          for module in ('core', 'app'):
              reports = sorted((root / module / 'build/test-results').rglob('TEST-*.xml'))
              if not reports:
                  raise SystemExit(f'Missing actual test reports: {module}')
              for report in reports:
                  suite = ET.parse(report).getroot()
                  suites.append({'module': module, 'name': suite.get('name'),
                      **{key: int(suite.get(key, '0')) for key in ('tests', 'failures', 'errors', 'skipped')}})
          if any(suite['failures'] or suite['errors'] for suite in suites):
              raise SystemExit('Test report records failures')
          with zipfile.ZipFile(apk) as archive:
              if not {'AndroidManifest.xml', 'classes.dex', 'resources.arsc'}.issubset(archive.namelist()):
                  raise SystemExit('APK is missing required packaged entries')
          evidence = {'apk': str(apk), 'bytes': apk.stat().st_size,
              'sha256': hashlib.file_digest(apk.open('rb'), 'sha256').hexdigest(), 'suites': suites,
              'tests': sum(suite['tests'] for suite in suites), 'skipped': sum(suite['skipped'] for suite in suites),
              'scope': 'Debug build, JVM tests, lint and signature; no physical-device or store acceptance'}
          (root / 'app/build/reports/artifact-verification.json').write_text(json.dumps(evidence, indent=2))
          print(json.dumps(evidence, indent=2))
          PY
      - name: Retain installable debug APK and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-reliability-android-debug
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/reports
            apps/android/core/build/reports/tests
          retention-days: 14
