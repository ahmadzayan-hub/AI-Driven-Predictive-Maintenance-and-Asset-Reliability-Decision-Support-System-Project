name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Third-party actions are pinned to a commit, never to a tag. A tag is a
# label its owner can move: `actions/checkout@v4` today and after a
# compromise of that repository are the same line of YAML running
# different code, with a token that can write to this repository. The
# comment names the release each commit was, so upgrading stays a
# readable diff. Re-resolve with:
#   git ls-remote --tags https://github.com/actions/checkout

# The token gets read access only; no job writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Two Playwright suites after a browser install: the install alone has
    # taken 12 minutes on a slow hosted runner (22 October 2026).
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dev
          POSTGRES_DB: agentic_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The run-engine suite runs against BOTH SQLite and PostgreSQL.
      # REQUIRE_PG turns an unreachable database into a hard failure so
      # the Postgres path can never be silently skipped in CI.
      PG_TEST_URL: postgresql://dev@127.0.0.1:5432/agentic_test
      REQUIRE_PG: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Python tests (agent, utils, API, runs)
        run: python -m unittest discover tests -v

      - name: Python dependency audit (informational)
        # Advisory only: a new transitive CVE should be visible without
        # blocking unrelated changes; triage findings in the PR.
        continue-on-error: true
        # Keep audit tooling out of the tested application environment and SBOM.
        run: |
          python -m venv "$RUNNER_TEMP/pip-audit"
          "$RUNNER_TEMP/pip-audit/bin/pip" install --quiet pip-audit
          "$RUNNER_TEMP/pip-audit/bin/pip-audit" --disable-pip --require-hashes -r requirements.txt

      - name: Bill of materials and licence check
        # Runs after the Python dependencies are installed and before the
        # npm ones, because it reads the lock file rather than
        # node_modules. Fails the build only on a shipped strong-copyleft
        # dependency; everything else it reports.
        run: python scripts/sbom.py --output sbom.json --check

      - name: Upload the bill of materials
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend dependency audit
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Frontend unit tests
        run: npm test
        working-directory: frontend

      - name: Brain and snapshot contracts
        run: |
          python scripts/brain_check.py --strict
          node --experimental-strip-types frontend/src/tests/native-run-logic.test.mjs

      - name: Type check and production build
        run: npm run build
        working-directory: frontend

      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: frontend

      - name: Cache the Playwright browser
        # The browser download is the slowest step on a hosted runner; the
        # key follows the Playwright version so an upgrade refreshes it.
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: End-to-end and accessibility tests
        run: npx playwright test
        working-directory: frontend

      - name: Miyaar bilingual, voice and accessibility tests
        run: npx playwright test --config=playwright.miyaar.config.ts
        working-directory: frontend

      - name: Interface budget
        run: python -c "from scripts.verify import check_budget; import sys; ok, detail = check_budget(); print(detail); sys.exit(0 if ok else 1)"

      - name: Upload UI evidence and production bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: agentic-ui-evidence
          path: |
            docs/screenshots/*.png
            frontend/dist
            frontend/test-results
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

