<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Asset Reliability" />
    <meta
      name="description"
      content="Maintenance and asset reliability decision support, powered by the Agentic OS analytics engine."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b1220" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="icon" href="/artwork/asset-reliability-mark.svg" type="image/svg+xml" />
    <title>AI-Driven Predictive Maintenance and Asset Reliability Decision-Support System SaaS Project</title>
    <script>
      // Apply the saved theme, motion and language settings before first
      // paint. Language goes on <html> as lang + dir, which is where CSS,
      // the bidi algorithm and screen readers read it from — set here so
      // an Arabic reader never sees a left-to-right flash.
      try {
        var theme = localStorage.getItem('aos-theme')
        if (theme === 'system') delete document.documentElement.dataset.theme
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
        }
        if (localStorage.getItem('aos-motion') === 'reduce') {
          document.documentElement.dataset.motion = 'reduce'
        }
        if (localStorage.getItem('aos-locale') === 'ar') {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
        }
      } catch (error) {
        /* localStorage unavailable — system settings apply */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
